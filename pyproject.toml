[project]
name = "mlda-swarm"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mlda-swarm = "mlda_swarm:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
